name: CI

on:
  # `pull_request` covers feature branches; limiting `push` to master avoids running
  # every branch twice while a PR is open, while still verifying what landed.
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CLAUDE.md: code must compile without warnings.
  RUSTFLAGS: -D warnings

jobs:
  lint:
    # fmt and clippy are platform-independent; running them once is enough.
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  ui:
    # The web UI's type check, tests and build. A job of its own, and nothing in the
    # Rust jobs depends on it: the npm tree must not be able to decide whether
    # the Rust suite passes (phase 3's supply-chain rule). The Rust jobs serve
    # the committed placeholder instead (D7).
    name: ui (check + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: crates/distlib-ui/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: crates/distlib-ui/web/.nvmrc
          cache: npm
          cache-dependency-path: crates/distlib-ui/web/package-lock.json
      # `ci`, never `install`: exactly the lockfile, or fail.
      - run: npm ci
      - run: npm run check
      # Vitest: the client modules against a fake node, and the components
      # rendered in jsdom.
      - run: npm test
      - run: npm run build

  ui-e2e:
    # The page in a real browser against a real node: a debug `distlib` (which
    # reads `web/dist` as it runs, so building the UI after it is fine) and
    # Playwright's headless Chromium. Like `ui`, no Rust job depends on it.
    name: ui (end to end)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crates/distlib-ui/web
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p distlib
      - uses: actions/setup-node@v5
        with:
          node-version-file: crates/distlib-ui/web/.nvmrc
          cache: npm
          cache-dependency-path: crates/distlib-ui/web/package-lock.json
      - run: npm ci
      # The headless shell alone, with the system libraries it needs.
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: crates/distlib-ui/web/test-results/
          retention-days: 7

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows builds the dependency tree from cold in well over the twenty
    # minutes Linux needs; thirty was sized for Linux alone.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # Windows keeps %TEMP% on C:, the runner's slow disk, and every test node
      # keeps its stores in a temporary directory. Measured: the suite took
      # 146-154s per run there and 85-94s on D:, and Raft's fsyncs queued up
      # on C: long enough to time out elections now and then.
      - if: runner.os == 'Windows'
        run: |
          echo "TMP=${{ runner.temp }}" >> $env:GITHUB_ENV
          echo "TEMP=${{ runner.temp }}" >> $env:GITHUB_ENV
      # Every test, slow ones included: `--all-features` turns on `slow-tests`,
      # which is what the fast local lane leaves out. nextest runs the tests
      # concurrently, `.config/nextest.toml` says how many, and nothing is
      # serialised.
      # `--no-fail-fast`: one run should show every test a platform breaks,
      # not the first one and a count of the rest that never ran.
      # `--profile ci` kills a test that hangs, so the log says which one and
      # where, rather than the job timing out an hour later with nothing.
      # `RUST_LOG` is for the failures that will not reproduce: the multi-node
      # harnesses log through it, and so does the binary `founding` runs, but
      # nextest prints a test's output only when it fails — so a passing run
      # is as quiet as ever, and a flaky one arrives with its log. Our own
      # crates and gossip at debug, since gossip is where the failures so far
      # have been (C25); QUIC's packet-level noise is cut.
      - run: cargo nextest run --workspace --all-features --no-fail-fast --profile ci
        env:
          RUST_LOG: info,distlib=debug,distlib_consensus=debug,distlib_net=debug,distlib_sync=debug,iroh_gossip=debug,noq_proto=warn
      # nextest does not run doctests, so they need their own pass.
      - run: cargo test --workspace --all-features --doc
