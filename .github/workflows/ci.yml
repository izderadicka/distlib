name: CI

on:
  # `pull_request` covers feature branches; limiting `push` to master avoids running
  # every branch twice while a PR is open, while still verifying what landed.
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CLAUDE.md: code must compile without warnings.
  RUSTFLAGS: -D warnings

jobs:
  lint:
    # fmt and clippy are platform-independent; running them once is enough.
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # Every test, slow ones included: `--all-features` turns on `slow-tests`,
      # which is what the fast local lane leaves out. nextest runs the test
      # binaries concurrently, which takes this from ~38s to ~18s, and
      # `.config/nextest.toml` caps how many run at once so a busy runner does
      # not make the election timers thrash.
      - run: cargo nextest run --workspace --all-features
      # nextest does not run doctests, so they need their own pass.
      - run: cargo test --workspace --all-features --doc
