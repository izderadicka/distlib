# TEMPORARY: measures how often the consensus cluster tests fail on Windows at
# different parallelism. Not for merging.
name: Windows stress (experiment)

on:
  pull_request:

jobs:
  stress:
    if: github.head_ref == 'ci/windows-stress'
    name: workspace x${{ matrix.threads }} threads, temp ${{ matrix.temp }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { threads: 4, temp: C }
          - { threads: 8, temp: C }
          - { threads: 8, temp: D }
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --all-features --no-run
      - if: matrix.temp == 'D'
        run: |
          echo "TMP=${{ runner.temp }}" >> $env:GITHUB_ENV
          echo "TEMP=${{ runner.temp }}" >> $env:GITHUB_ENV
      - run: cargo nextest run --workspace --all-features --no-fail-fast --test-threads ${{ matrix.threads }} --stress-count 4
        env:
          RUST_LOG: info,distlib=debug,distlib_consensus=debug,distlib_net=debug,distlib_sync=debug,iroh_gossip=debug,noq_proto=warn
