[package]
name = "distlib"
description = "Distributed community media library for closed, trusted groups"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "distlib"
path = "src/lib.rs"

[[bin]]
name = "distlib"
path = "src/main.rs"

[features]
# See `distlib-consensus`: here it gates the founding test, which builds and
# runs real `distlib` processes.
default = ["slow-tests"]
slow-tests = []

[dependencies]
distlib-core = { workspace = true }
distlib-net = { workspace = true }
distlib-consensus = { workspace = true }
distlib-api = { workspace = true }
distlib-sync = { workspace = true }
serde_json = { workspace = true }
iroh = { workspace = true }
# The one gossip instance in the process: the memberlog announces on it, and
# from 2a-2 iroh-docs is handed the same one.
iroh-gossip = { workspace = true }
# The content store the catalogue is built on; opened here because the process
# owns it, like the endpoint and the gossip.
iroh-blobs = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
