[package]
name = "distlib-consensus"
description = "The membership log: signed events, their projection, and the Raft that commits them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
distlib-core = { workspace = true }
distlib-net = { workspace = true }
iroh = { workspace = true }
iroh-gossip = { workspace = true }
bytes = { workspace = true }
futures-lite = { workspace = true }
blake3 = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }
thiserror = { workspace = true }
openraft = { workspace = true }
redb = { workspace = true }
# spawn_blocking, so redb's fsync stays off the async workers.
tokio = { workspace = true }
# openraft's own error payload type, needed to build a StorageIOError.
anyerror = { workspace = true }
# The state machine warns when a committed event is rejected.
tracing = { workspace = true }

[dev-dependencies]
# Enables `RawMemberId: From<u64>`, which openraft's conformance suite needs.
distlib-core = { workspace = true, features = ["testing"] }
iroh = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
