[package]
name = "distlib-net"
description = "iroh endpoint, ALPN registry, membership allowlist enforcement and transport protocols"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
distlib-core = { workspace = true }
iroh = { workspace = true }
# For `Transport`: the one gossip a process has, passed alongside the endpoint
# to everything that speaks on it. This crate does not serve gossip itself.
iroh-gossip = { workspace = true }
# For `blobs`: fetching a media blob by hash from a chosen set of providers.
# Not the `BlobsProtocol` registration `distlib-sync::Catalogue` already owns
# on the router (2a-2) — see the module doc for why that stays where it is.
iroh-blobs = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Only to forge a `SignedAddress` on the wire, which is what the directory's
# signature check exists to refuse.
postcard = { workspace = true }
iroh = { workspace = true, features = ["test-utils"] }
iroh-relay = { workspace = true }

[lints]
workspace = true
