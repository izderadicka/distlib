[package]
name = "distlib-store"
description = "The read model: the catalogue projected into SQLite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
distlib-core = { workspace = true }
# The projection reads whole items out of the catalogue and watches it for what
# changed. The dependency goes this way and never the other: the catalogue is
# the record, this is derived from it, and nothing in `distlib-sync` may come to
# depend on a read model being there.
distlib-sync = { workspace = true }
# For `MembershipState`: the `members` table is projected from the log, not from
# the document — those members are the only ones anybody agreed on.
distlib-consensus = { workspace = true }
rusqlite = { workspace = true }
tantivy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
# For a member id in the `members` tests; nothing in the crate itself needs one.
iroh = { workspace = true }

[lints]
workspace = true
