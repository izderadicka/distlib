[package]
name = "distlib-api"
description = "Local JSON-RPC API for controlling a distlib node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The lane split from PR #24. A four-voter group is the smallest one where an
# approval can land, count, and still leave a proposal waiting — worth testing,
# but four raft nodes do not belong in a lane whose job is feedback in seconds.
[features]
default = ["slow-tests"]
slow-tests = []

[dependencies]
distlib-core = { workspace = true }
distlib-consensus = { workspace = true }
distlib-store = { workspace = true }
distlib-sync = { workspace = true }
# For `library.download`: fetching a media blob from the members who might
# hold it, and writing it out to a file. The whole of this crate's contact
# with iroh-blobs goes through `distlib_net::Blobs` and `distlib_sync`, per
# §5.1's wrap-don't-expose rule.
distlib-net = { workspace = true }
axum = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
tokio = { workspace = true }
futures-lite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
secrecy = { workspace = true }
iroh = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
distlib-net = { workspace = true }
# The tests assemble a node the way production does, gossip and all.
iroh-gossip = { workspace = true }
# For `MemStore`: the harness's own catalogue needs a blob store to open, and
# an in-memory one costs nothing these tests need to pay for.
iroh-blobs = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
