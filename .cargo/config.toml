# Two lanes over the same suite. The difference is the `slow-tests` feature,
# which is on by default — so `cargo test` and `cargo test-all` run everything,
# and only `test-fast` leaves anything out. Nobody can test less than they think
# by accident; they have to ask.
#
# Both use cargo-nextest, which runs test binaries concurrently rather than one
# after another. That matters here because the suite is a handful of slow
# binaries and a long tail of instant ones: `cargo test` takes the sum, ~38s,
# where nextest takes about the length of its slowest test.
#
#   cargo install cargo-nextest --locked
#
# Plain `cargo test` still works and still runs everything, for anyone who has
# not installed it.
[alias]
# ~4s, 155 tests. Everything except real elections, openraft's storage suite,
# the property tests and the tests that spawn processes or wait out timeouts.
test-fast = "nextest run --workspace --no-default-features"
# ~13s, 164 tests. What CI runs.
test-all = "nextest run --workspace --all-features"
