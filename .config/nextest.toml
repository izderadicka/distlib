[profile.default]
# Our tests are clusters of nodes with real timers: they mostly wait, so they
# run in parallel well beyond what their CPU would suggest. Eight is where the
# whole lane stops getting faster here — it is then as long as its slowest
# test — and running more at once stretched a few cluster tests by seconds
# without failing any.
#
# Nothing is serialised on purpose. Every test stands up its own nodes, keys,
# directories and ports, so a test that fails only alongside others is either
# a deadline too tight for a busy machine or code that misbehaves when it is
# scheduled late — and both are worth seeing rather than hiding. The last test
# group this suite had was credited with fixing a port race it only made
# rarer.
test-threads = 8

# CI only (`--profile ci`): a test still running after five minutes is killed
# and its output printed. Without it a hang shows as the job's own timeout an
# hour later — cancelled, with nothing to say which step it was stuck on.
[profile.ci]
slow-timeout = { period = "60s", terminate-after = 5 }
